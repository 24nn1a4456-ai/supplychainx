services:
  # ── Backend: FastAPI + SQLite ──────────────────────────────────────────────
  - type: web
    name: supply-chain-x-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/backend/supply_chain.db
      - key: CORS_ORIGINS
        value: "https://supplychainmultiagent.vercel.app,https://supply-chain-x-frontend.onrender.com,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,*"
      - key: PORT
        value: 10000

  # ── Frontend: React/Vite static site ──────────────────────────────────────
  - type: web
    name: supply-chain-x-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://supply-chain-x-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
